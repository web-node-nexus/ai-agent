# Minimal Supabase CLI config for TaraWorld.
# Full defaults: https://supabase.com/docs/guides/cli/config
# Link with: supabase link --project-ref <ref>

project_id = "taraworld"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

# Create buckets in dashboard or via migration/seed:
#   characters        — public
#   generated-images  — private
