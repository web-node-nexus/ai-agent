# Sample Nginx site for TaraWorld
# Copy to /etc/nginx/sites-available/taraworld and adjust server_name + cert paths.
# Obtain certs first: certbot --nginx -d taraworld.in -d www.taraworld.in

upstream taraworld_next {
  server 127.0.0.1:3000;
  keepalive 64;
}

# HTTP → HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name taraworld.in www.taraworld.in;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name taraworld.in www.taraworld.in;

  # Certbot-managed paths (adjust if using custom certs)
  ssl_certificate     /etc/letsencrypt/live/taraworld.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/taraworld.in/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Security headers (tune CSP to your needs)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 12m;

  # Streaming chat — proxy_buffering MUST be off
  location /api/chat {
    proxy_pass http://taraworld_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Long-lived call / webhook routes
  location ~ ^/api/(call|webhooks)/ {
    proxy_pass http://taraworld_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://taraworld_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
